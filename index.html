<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairFit - Desafio de Perda de Peso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ==========================================
        // CHAVES DO FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC_H5RRr8OgNAyd0xV01oFG-sQmnUQtA5M",
            authDomain: "fairfit-61158.firebaseapp.com",
            projectId: "fairfit-61158",
            storageBucket: "fairfit-61158.firebasestorage.app",
            messagingSenderId: "815073249544",
            appId: "1:815073249544:web:31a40eb1baaf1bcdbec4bd",
            measurementId: "G-43K3MJ4S7B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let participants = [];
        let editingId = null;
        let chartInstances = {};
        let currentUserId = null;
        let unsubscribeSnapshot = null;
        let isFetching = true; // Estado de carregamento inicial

        // ==========================================
        // AUTENTICAÇÃO COM GOOGLE
        // ==========================================
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Erro completo:", error);
                alert("Erro do Firebase: " + error.code + "\n" + error.message);
            });
        };

        window.logout = function() {
            signOut(auth).catch((error) => console.error("Erro ao sair:", error));
        };

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');
            const userProfilePic = document.getElementById('userProfilePic');
            const userNameDisplay = document.getElementById('userNameDisplay');

            if (user) {
                currentUserId = user.uid;
                loginScreen.style.display = 'none';
                appScreen.style.display = 'block';
                userProfilePic.src = user.photoURL || '';
                userNameDisplay.innerText = user.displayName.split(' ')[0];
                isFetching = true;
                renderDashboard(); // Renderiza o Loading

                const userParticipantsRef = collection(db, "users", currentUserId, "participants");
                
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                
                unsubscribeSnapshot = onSnapshot(userParticipantsRef, (snapshot) => {
                    participants = [];
                    snapshot.forEach((doc) => {
                        participants.push({ id: doc.id, ...doc.data() });
                    });
                    isFetching = false;
                    renderDashboard();
                });
            } else {
                currentUserId = null;
                loginScreen.style.display = 'flex';
                appScreen.style.display = 'none';
                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                    unsubscribeSnapshot = null;
                }
            }
        });

        // ==========================================
        // OPERAÇÕES NO BANCO DE DADOS
        // ==========================================
        window.saveParticipantToCloud = async function(participant) {
            if (!currentUserId) return;
            try {
                await setDoc(doc(db, "users", currentUserId, "participants", participant.id), participant);
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar dados.");
            }
        };

        window.deleteParticipantFromCloud = async function(id) {
            if (!currentUserId) return;
            try {
                await deleteDoc(doc(db, "users", currentUserId, "participants", id));
            } catch (error) {
                console.error("Erro ao excluir:", error);
            }
        };

        // ==========================================
        // LÓGICA DE CÁLCULO E INTERFACE
        // ==========================================
        function calculateIdealWeight(height) {
            const heightInMeters = height / 100;
            return 25 * (heightInMeters * heightInMeters);
        }

        function calculateMetrics(participant) {
            const firstRecord = participant.weightHistory[0];
            const lastRecord = participant.weightHistory[participant.weightHistory.length - 1];
            
            const initialWeight = firstRecord.weight;
            const currentWeight = lastRecord.weight;
            const heightInMeters = participant.height / 100;
            
            const initialIMC = initialWeight / (heightInMeters * heightInMeters);
            const currentIMC = currentWeight / (heightInMeters * heightInMeters);
            
            const maxHealthyWeight = calculateIdealWeight(participant.height);
            let excessWeight = initialWeight - maxHealthyWeight;
            const minimumChallenge = initialWeight * 0.15;
            if (excessWeight < minimumChallenge) excessWeight = minimumChallenge;
            
            const weightLost = initialWeight - currentWeight;
            const scorePercentage = (weightLost / excessWeight) * 100;
            const imcDrop = initialIMC - currentIMC;

            // Cálculo das Medidas (Peito, Abdômen, Quadril)
            const initialMeasurementsTotal = (firstRecord.chest || 0) + (firstRecord.abs || 0) + (firstRecord.hips || 0);
            const currentMeasurementsTotal = (lastRecord.chest || 0) + (lastRecord.abs || 0) + (lastRecord.hips || 0);
            
            let cmLost = 0;
            let cmLostPercentage = 0;

            if (initialMeasurementsTotal > 0 && currentMeasurementsTotal > 0) {
                cmLost = initialMeasurementsTotal - currentMeasurementsTotal;
                cmLostPercentage = (cmLost / initialMeasurementsTotal) * 100;
            }
            
            let badges = [];
            if (scorePercentage >= 50) badges.push({ icon: '🌟', title: 'Estrela' });
            else if (scorePercentage >= 20) badges.push({ icon: '⭐', title: 'Focado' });
            
            if (participant.weightHistory.length >= 3) {
                const w1 = participant.weightHistory[participant.weightHistory.length-1].weight;
                const w2 = participant.weightHistory[participant.weightHistory.length-2].weight;
                const w3 = participant.weightHistory[participant.weightHistory.length-3].weight;
                if (w1 < w2 && w2 < w3) badges.push({ icon: '🐢', title: 'Consistente' });
            }
            
            if (participant.targetWeight > 0 && currentWeight <= participant.targetWeight) {
                badges.push({ icon: '🎯', title: 'Meta Batida' });
            }

            return { initialIMC, currentIMC, scorePercentage, imcDrop, weightLost, badges, cmLost, cmLostPercentage };
        }

        window.toggleModal = function(show) {
            document.getElementById('modal').style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('form').reset();
                editingId = null;
                document.getElementById('initialWeight').disabled = false;
                document.getElementById('initialChest').disabled = false;
                document.getElementById('initialAbs').disabled = false;
                document.getElementById('initialHips').disabled = false;
            }
        };

        window.openAddWeightModal = function(id) {
            const p = participants.find(x => x.id === id);
            const lastRecord = p.weightHistory[p.weightHistory.length - 1];
            
            document.getElementById('addWeightId').value = id;
            document.getElementById('newWeightLabel').innerText = `Nova Avaliação para ${p.name}`;
            
            // Mostrar último peso como referência
            document.getElementById('lastWeightInfo').innerText = `Último peso registrado: ${lastRecord.weight.toFixed(1)} kg`;
            
            // Limpar campos
            document.getElementById('newWeightInput').value = '';
            document.getElementById('newChestInput').value = '';
            document.getElementById('newAbsInput').value = '';
            document.getElementById('newHipsInput').value = '';

            // Colocar os últimos valores como placeholder visual
            document.getElementById('newChestInput').placeholder = lastRecord.chest ? `Último: ${lastRecord.chest} cm` : 'cm';
            document.getElementById('newAbsInput').placeholder = lastRecord.abs ? `Último: ${lastRecord.abs} cm` : 'cm';
            document.getElementById('newHipsInput').placeholder = lastRecord.hips ? `Último: ${lastRecord.hips} cm` : 'cm';

            document.getElementById('addWeightModal').style.display = 'flex';
        };

        window.closeAddWeightModal = function() {
            document.getElementById('addWeightModal').style.display = 'none';
        };

        window.confirmDelete = function(id) {
            if(confirm("Tem certeza que deseja excluir este participante?")) {
                deleteParticipantFromCloud(id);
            }
        };

        // Submissão do novo peso e medidas
        document.getElementById('addWeightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('addWeightId').value;
            const p = participants.find(x => x.id === id);
            const lastRecord = p.weightHistory[p.weightHistory.length - 1];
            
            const newWeight = parseFloat(document.getElementById('newWeightInput').value);
            const date = new Date().toLocaleDateString('pt-BR');

            // Se deixar em branco, mantém o valor da última avaliação
            const newChestInput = document.getElementById('newChestInput').value;
            const newAbsInput = document.getElementById('newAbsInput').value;
            const newHipsInput = document.getElementById('newHipsInput').value;

            const newChest = newChestInput !== '' ? parseFloat(newChestInput) : (lastRecord.chest || 0);
            const newAbs = newAbsInput !== '' ? parseFloat(newAbsInput) : (lastRecord.abs || 0);
            const newHips = newHipsInput !== '' ? parseFloat(newHipsInput) : (lastRecord.hips || 0);

            // Evitar duplicados no mesmo dia: Se a data for igual à última, apenas atualiza
            if (lastRecord.date === date) {
                lastRecord.weight = newWeight;
                lastRecord.chest = newChest;
                lastRecord.abs = newAbs;
                lastRecord.hips = newHips;
            } else {
                p.weightHistory.push({ date, weight: newWeight, chest: newChest, abs: newAbs, hips: newHips });
            }
            
            saveParticipantToCloud(p);
            closeAddWeightModal();
        });

        // Criação ou Edição do Competidor
        document.getElementById('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const p = {
                name: document.getElementById('name').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                height: parseFloat(document.getElementById('height').value),
                targetWeight: parseFloat(document.getElementById('targetWeight').value) || 0
            };

            const initialChest = parseFloat(document.getElementById('initialChest').value) || 0;
            const initialAbs = parseFloat(document.getElementById('initialAbs').value) || 0;
            const initialHips = parseFloat(document.getElementById('initialHips').value) || 0;

            if (editingId) {
                const existing = participants.find(x => x.id === editingId);
                existing.name = p.name;
                existing.age = p.age;
                existing.gender = p.gender;
                existing.height = p.height;
                existing.targetWeight = p.targetWeight;
                // Atualizar as medidas do dia 1
                existing.weightHistory[0].chest = initialChest;
                existing.weightHistory[0].abs = initialAbs;
                existing.weightHistory[0].hips = initialHips;
                saveParticipantToCloud(existing);
            } else {
                p.id = Date.now().toString();
                p.weightHistory = [{
                    date: new Date().toLocaleDateString('pt-BR'),
                    weight: parseFloat(document.getElementById('initialWeight').value),
                    chest: initialChest,
                    abs: initialAbs,
                    hips: initialHips
                }];
                saveParticipantToCloud(p);
            }
            toggleModal(false);
        });

        window.editParticipant = function(id) {
            const p = participants.find(x => x.id === id);
            const firstRecord = p.weightHistory[0];

            document.getElementById('name').value = p.name;
            document.getElementById('age').value = p.age;
            document.getElementById('gender').value = p.gender;
            document.getElementById('height').value = p.height;
            document.getElementById('initialWeight').value = firstRecord.weight;
            document.getElementById('targetWeight').value = p.targetWeight || '';
            
            document.getElementById('initialChest').value = firstRecord.chest || '';
            document.getElementById('initialAbs').value = firstRecord.abs || '';
            document.getElementById('initialHips').value = firstRecord.hips || '';
            
            document.getElementById('initialWeight').disabled = true; // Não deixa mudar o primeiro peso
            editingId = p.id;
            toggleModal(true);
        };

        function renderDashboard() {
            const container = document.getElementById('participantsList');
            container.innerHTML = '';
            
            if (isFetching) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-white/60 text-lg">A carregar o teu desafio...</p>
                    </div>`;
                return;
            }

            if (participants.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white/5 backdrop-blur-sm rounded-3xl border border-white/10">
                        <p class="text-white/60 text-lg mb-4">Seu desafio está vazio.</p>
                        <button onclick="toggleModal(true)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full transition-all shadow-lg font-medium">
                            Adicionar Primeiro Competidor
                        </button>
                    </div>`;
                return;
            }

            const evaluated = participants.map(p => ({ ...p, metrics: calculateMetrics(p) }));
            evaluated.sort((a, b) => b.metrics.scorePercentage - a.metrics.scorePercentage);

            if (evaluated.length > 0 && evaluated[0].weightHistory.length > 1) {
                evaluated[0].metrics.badges.unshift({ icon: '🔥', title: 'On Fire' });
            }

            evaluated.forEach((p, index) => {
                const initialWeight = p.weightHistory[0].weight;
                const currentWeight = p.weightHistory[p.weightHistory.length - 1].weight;
                
                let targetProgress = '';
                if (p.targetWeight > 0 && initialWeight > p.targetWeight) {
                    const totalToLose = initialWeight - p.targetWeight;
                    const currentLost = initialWeight - currentWeight;
                    let targetPct = Math.min(100, Math.max(0, (currentLost / totalToLose) * 100));
                    targetProgress = `
                        <div class="mt-2">
                            <div class="flex justify-between text-xs text-white/70 mb-1">
                                <span>Meta Pessoal (${p.targetWeight}kg)</span>
                                <span>${targetPct.toFixed(1)}%</span>
                            </div>
                            <div class="w-full bg-black/20 rounded-full h-1.5">
                                <div class="bg-pink-400 h-1.5 rounded-full" style="width: ${targetPct}%"></div>
                            </div>
                        </div>
                    `;
                }

                let measurementsHtml = '';
                if (p.metrics.cmLost > 0) {
                    measurementsHtml = `
                    <div class="mt-3 bg-white/5 rounded-xl p-3 border border-white/10 flex justify-between items-center">
                        <div>
                            <p class="text-white/60 text-[10px] uppercase font-bold tracking-wider">Medidas Perdidas</p>
                            <p class="text-white font-medium text-sm">-${p.metrics.cmLost.toFixed(1)} cm totais</p>
                        </div>
                        <div class="text-right">
                            <span class="text-cyan-400 font-bold text-sm">-${p.metrics.cmLostPercentage.toFixed(1)}%</span>
                            <p class="text-white/40 text-[10px]">do volume corporal</p>
                        </div>
                    </div>`;
                } else if (p.metrics.cmLost < 0) { // Se ganhou medidas
                     measurementsHtml = `
                    <div class="mt-3 bg-white/5 rounded-xl p-3 border border-red-500/20 flex justify-between items-center">
                        <div>
                            <p class="text-white/60 text-[10px] uppercase font-bold tracking-wider">Variação Medidas</p>
                            <p class="text-white font-medium text-sm">+${Math.abs(p.metrics.cmLost).toFixed(1)} cm totais</p>
                        </div>
                        <div class="text-right">
                            <span class="text-red-400 font-bold text-sm">+${Math.abs(p.metrics.cmLostPercentage).toFixed(1)}%</span>
                        </div>
                    </div>`;
                }

                const badgesHtml = p.metrics.badges.map(b => `<span title="${b.title}" class="text-xl">${b.icon}</span>`).join(' ');

                const card = document.createElement('div');
                card.className = "bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-6 shadow-xl relative overflow-hidden";
                card.innerHTML = `
                    ${index === 0 ? '<div class="absolute -right-6 -top-6 bg-yellow-400/20 w-24 h-24 rounded-full blur-2xl"></div>' : ''}
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-xl font-bold text-white">#${index + 1} ${p.name}</h3>
                                ${badgesHtml}
                            </div>
                            <p class="text-white/60 text-sm">${p.age} anos • ${p.height}cm • ${p.gender === 'M' ? 'Masc' : 'Fem'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openAddWeightModal('${p.id}')" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white" title="Atualizar Avaliação">⚖️</button>
                            <button onclick="editParticipant('${p.id}')" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white" title="Editar">✏️</button>
                            <button onclick="confirmDelete('${p.id}')" class="p-2 bg-red-500/20 hover:bg-red-500/40 rounded-full text-red-200" title="Excluir">🗑️</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4 relative z-10">
                        <div class="bg-black/20 rounded-2xl p-4 text-center">
                            <p class="text-white/60 text-xs mb-1">PESO INICIAL</p>
                            <p class="text-2xl font-bold text-white">${initialWeight.toFixed(1)} <span class="text-sm font-normal">kg</span></p>
                            <p class="text-white/50 text-xs mt-1">IMC: ${p.metrics.initialIMC.toFixed(1)}</p>
                        </div>
                        <div class="bg-white/10 rounded-2xl p-4 text-center border border-white/20 shadow-[inset_0_0_20px_rgba(255,255,255,0.05)]">
                            <p class="text-white/80 text-xs mb-1 font-semibold">PESO ATUAL</p>
                            <p class="text-2xl font-bold text-white">${currentWeight.toFixed(1)} <span class="text-sm font-normal">kg</span></p>
                            <div class="flex justify-center items-center gap-2 mt-1">
                                <p class="text-white/80 text-xs">IMC: ${p.metrics.currentIMC.toFixed(1)}</p>
                                ${p.metrics.imcDrop > 0.1 ? `<span class="bg-green-500/20 text-green-300 text-[10px] px-1.5 py-0.5 rounded">-${p.metrics.imcDrop.toFixed(1)}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="mb-4 relative z-10">
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-sm text-white/80">Pontuação Justa (%PEP)</span>
                            <span class="text-xl font-bold text-green-400">${p.metrics.scorePercentage.toFixed(1)}%</span>
                        </div>
                        <div class="w-full bg-black/20 rounded-full h-2">
                            <div class="bg-gradient-to-r from-emerald-400 to-green-400 h-2 rounded-full transition-all duration-1000" style="width: ${Math.min(100, Math.max(0, p.metrics.scorePercentage))}%"></div>
                        </div>
                        ${targetProgress}
                        ${measurementsHtml}
                    </div>
                    <div class="mt-4 h-24 relative z-10 bg-black/10 rounded-xl p-2">
                        <canvas id="chart-${p.id}"></canvas>
                    </div>
                `;
                container.appendChild(card);

                const ctx = document.getElementById(`chart-${p.id}`).getContext('2d');
                if (chartInstances[p.id]) chartInstances[p.id].destroy();
                chartInstances[p.id] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: p.weightHistory.map(w => w.date.substring(0,5)),
                        datasets: [{
                            data: p.weightHistory.map(w => w.weight),
                            borderColor: 'rgba(255, 255, 255, 0.6)',
                            backgroundColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 2, tension: 0.4, fill: true, pointRadius: 3, pointBackgroundColor: '#fff'
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                        scales: { x: { display: true, ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 9 } }, grid: { display: false } }, y: { display: false, min: Math.min(...p.weightHistory.map(w=>w.weight)) - 2, max: Math.max(...p.weightHistory.map(w=>w.weight)) + 2 } }
                    }
                });
            });
        }

        window.copyRanking = function() {
            if (participants.length === 0) return alert("Nenhum participante para gerar ranking.");
            const evaluated = participants.map(p => ({ ...p, metrics: calculateMetrics(p) }));
            evaluated.sort((a, b) => b.metrics.scorePercentage - a.metrics.scorePercentage);
            let text = "🏆 *FairFit Challenge - Ranking*\n\n";
            const medals = ['🥇', '🥈', '🥉'];
            evaluated.forEach((p, i) => {
                const medal = i < 3 ? medals[i] : '🏅';
                const badges = p.metrics.badges.map(b => b.icon).join('');
                text += `${medal} *${p.name}* ${badges}\nPontuação Justa: ${p.metrics.scorePercentage.toFixed(1)}%\nPerdeu Peso: ${p.metrics.weightLost.toFixed(1)}kg\n`;
                if(p.metrics.cmLost > 0) text += `Perdeu Medidas: ${p.metrics.cmLost.toFixed(1)}cm (${p.metrics.cmLostPercentage.toFixed(1)}%)\n`;
                text += `\n`;
            });
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            alert("Ranking copiado para a área de transferência! É só colar no WhatsApp.");
        };
    </script>
    <style>
        body { background: linear-gradient(135deg, #1e1e2f 0%, #0f0f1a 100%); min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0;}
        .bg-shapes { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none;}
        .shape { position: absolute; filter: blur(80px); opacity: 0.5; animation: float 20s infinite ease-in-out; }
        .shape-1 { background: #4f46e5; width: 400px; height: 400px; top: -100px; left: -100px; border-radius: 50%; }
        .shape-2 { background: #ec4899; width: 300px; height: 300px; bottom: 100px; right: -50px; border-radius: 50%; animation-delay: -5s; }
        .shape-3 { background: #06b6d4; width: 350px; height: 350px; top: 40%; left: 30%; border-radius: 50%; animation-delay: -10s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(30px, -50px); } 66% { transform: translate(-20px, 40px); } }
        input, select { background: rgba(0,0,0,0.2) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus, select:focus { outline: none; border-color: rgba(255,255,255,0.5) !important; }
        option { background: #1e1e2f; color: white; }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 z-10 relative">
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 rounded-3xl w-full max-w-md text-center shadow-2xl">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-500 to-cyan-400 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg rotate-3">
                <span class="text-4xl">⚖️</span>
            </div>
            <h1 class="text-3xl font-black text-white mb-2 tracking-tight">FairFit</h1>
            <p class="text-white/60 mb-8">Crie seu desafio de perda de peso de forma justa. Seus dados serão salvos na sua conta.</p>
            
            <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition-all shadow-lg">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google Logo">
                Entrar com o Google
            </button>
        </div>
    </div>

    <!-- TELA DO APLICATIVO -->
    <div id="appScreen" class="hidden p-4 md:p-8 z-10 relative">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8 bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-4">
                <div class="flex items-center gap-3">
                    <img id="userProfilePic" src="" alt="Perfil" class="w-10 h-10 rounded-full border-2 border-white/20">
                    <div>
                        <p class="text-white font-semibold text-sm">Olá, <span id="userNameDisplay"></span> 👋</p>
                        <p class="text-white/50 text-xs">Seu desafio privado</p>
                    </div>
                </div>
                <button onclick="logout()" class="text-white/60 hover:text-white text-sm bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg transition">Sair</button>
            </div>

            <header class="mb-10 text-center">
                <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-white/60 tracking-tight drop-shadow-sm mb-6">
                    FairFit Challenge
                </h1>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="toggleModal(true)" class="bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-full backdrop-blur-md border border-white/20 transition-all font-semibold flex items-center gap-2 shadow-lg">
                        <span>+</span> Novo Competidor
                    </button>
                    <button onclick="copyRanking()" class="bg-green-500/20 hover:bg-green-500/30 text-green-300 px-6 py-3 rounded-full backdrop-blur-md border border-green-500/30 transition-all font-semibold shadow-lg">
                        📱 Copiar Ranking
                    </button>
                </div>
            </header>

            <div id="participantsList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </div>
    </div>

    <!-- Modal Novo/Editar Competidor -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1a1a2e] border border-white/10 p-6 md:p-8 rounded-3xl w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-2xl font-bold text-white mb-6">Competidor</h2>
            <form id="form" class="space-y-4">
                <div>
                    <label class="block text-sm text-white/60 mb-1">Nome</label>
                    <input type="text" id="name" required class="w-full p-3 rounded-xl">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-white/60 mb-1">Idade</label>
                        <input type="number" id="age" required class="w-full p-3 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm text-white/60 mb-1">Sexo</label>
                        <select id="gender" class="w-full p-3 rounded-xl">
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-white/60 mb-1">Altura (cm)</label>
                        <input type="number" id="height" required class="w-full p-3 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm text-white/60 mb-1">Peso Inicial (kg)</label>
                        <input type="number" step="0.1" id="initialWeight" required class="w-full p-3 rounded-xl">
                    </div>
                </div>
                
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <p class="text-sm font-semibold text-white/80 mb-3">Medidas Iniciais (Opcional)</p>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] text-white/60 mb-1 uppercase tracking-wider">Peito (cm)</label>
                            <input type="number" step="0.1" id="initialChest" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                        <div>
                            <label class="block text-[11px] text-white/60 mb-1 uppercase tracking-wider">Abdômen</label>
                            <input type="number" step="0.1" id="initialAbs" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                        <div>
                            <label class="block text-[11px] text-white/60 mb-1 uppercase tracking-wider">Quadril</label>
                            <input type="number" step="0.1" id="initialHips" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-white/60 mb-1">Meta Pessoal de Peso (kg) - Opcional</label>
                    <input type="number" step="0.1" id="targetWeight" class="w-full p-3 rounded-xl">
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 p-3 rounded-xl bg-white/5 text-white hover:bg-white/10 font-semibold transition">Cancelar</button>
                    <button type="submit" class="flex-1 p-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold transition">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Nova Avaliação (Peso e Medidas) -->
    <div id="addWeightModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1a1a2e] border border-white/10 p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-2xl relative">
            <h2 id="newWeightLabel" class="text-xl font-bold text-white mb-2">Nova Avaliação</h2>
            <p id="lastWeightInfo" class="text-xs text-white/50 mb-6 bg-white/5 inline-block px-3 py-1 rounded-full"></p>
            
            <form id="addWeightForm" class="space-y-4">
                <input type="hidden" id="addWeightId">
                <div>
                    <label class="block text-sm text-white/60 mb-1 font-medium">Peso Atual (kg)</label>
                    <input type="number" step="0.1" id="newWeightInput" required class="w-full p-4 rounded-xl text-3xl text-center font-bold bg-white/5 border border-white/20 text-white focus:border-green-400">
                </div>
                
                <div class="bg-black/20 p-4 rounded-xl border border-white/5 mt-4">
                    <p class="text-xs font-semibold text-white/60 mb-3">Novas Medidas (Deixe vazio para manter as últimas)</p>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] text-white/50 mb-1 uppercase tracking-wider text-center">Peito</label>
                            <input type="number" step="0.1" id="newChestInput" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                        <div>
                            <label class="block text-[10px] text-white/50 mb-1 uppercase tracking-wider text-center">Abdômen</label>
                            <input type="number" step="0.1" id="newAbsInput" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                        <div>
                            <label class="block text-[10px] text-white/50 mb-1 uppercase tracking-wider text-center">Quadril</label>
                            <input type="number" step="0.1" id="newHipsInput" class="w-full p-2 rounded-lg text-sm text-center">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeAddWeightModal()" class="flex-1 p-3 rounded-xl bg-white/5 text-white hover:bg-white/10 font-semibold transition">Cancelar</button>
                    <button type="submit" class="flex-1 p-3 rounded-xl bg-green-500 hover:bg-green-600 text-white font-semibold transition">Atualizar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
