<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairFit - Desafio de Perda de Peso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        // Importações do Firebase (mantidas na versão estável compatível com o app)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // ==========================================
        // SUAS CHAVES DO FIREBASE APLICADAS
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC_H5RRr8OgNAyd0xV01oFG-sQmnUQtA5M",
            authDomain: "fairfit-61158.firebaseapp.com",
            projectId: "fairfit-61158",
            storageBucket: "fairfit-61158.firebasestorage.app",
            messagingSenderId: "815073249544",
            appId: "1:815073249544:web:31a40eb1baaf1bcdbec4bd",
            measurementId: "G-43K3MJ4S7B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let participants = [];
        let editingId = null;
        let chartInstances = {};
        let currentUserId = null;
        let unsubscribeSnapshot = null;

        // ==========================================
        // AUTENTICAÇÃO COM GOOGLE
        // ==========================================
        
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Erro no login:", error);
                alert("Erro ao fazer login com Google.");
            });
        };

        window.logout = function() {
            signOut(auth).catch((error) => console.error("Erro ao sair:", error));
        };

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');
            const userProfilePic = document.getElementById('userProfilePic');
            const userNameDisplay = document.getElementById('userNameDisplay');

            if (user) {
                currentUserId = user.uid;
                loginScreen.style.display = 'none';
                appScreen.style.display = 'block';
                userProfilePic.src = user.photoURL || '';
                userNameDisplay.innerText = user.displayName.split(' ')[0];

                const userParticipantsRef = collection(db, "users", currentUserId, "participants");
                
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                
                unsubscribeSnapshot = onSnapshot(userParticipantsRef, (snapshot) => {
                    participants = [];
                    snapshot.forEach((doc) => {
                        participants.push({ id: doc.id, ...doc.data() });
                    });
                    renderDashboard();
                });
            } else {
                currentUserId = null;
                loginScreen.style.display = 'flex';
                appScreen.style.display = 'none';
                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                    unsubscribeSnapshot = null;
                }
            }
        });

        // ==========================================
        // OPERAÇÕES NO BANCO DE DADOS
        // ==========================================
        window.saveParticipantToCloud = async function(participant) {
            if (!currentUserId) return;
            try {
                await setDoc(doc(db, "users", currentUserId, "participants", participant.id), participant);
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar dados. Verifique se o Firestore Database está criado e no 'Modo de Teste'.");
            }
        };

        window.deleteParticipantFromCloud = async function(id) {
            if (!currentUserId) return;
            try {
                await deleteDoc(doc(db, "users", currentUserId, "participants", id));
            } catch (error) {
                console.error("Erro ao excluir:", error);
            }
        };

        // ==========================================
        // LÓGICA DE CÁLCULO E INTERFACE
        // ==========================================
        function calculateIdealWeight(height) {
            const heightInMeters = height / 100;
            return 25 * (heightInMeters * heightInMeters);
        }

        function calculateMetrics(participant) {
            const initialWeight = participant.weightHistory[0].weight;
            const currentWeight = participant.weightHistory[participant.weightHistory.length - 1].weight;
            const heightInMeters = participant.height / 100;
            const initialIMC = initialWeight / (heightInMeters * heightInMeters);
            const currentIMC = currentWeight / (heightInMeters * heightInMeters);
            
            const maxHealthyWeight = calculateIdealWeight(participant.height);
            let excessWeight = initialWeight - maxHealthyWeight;
            const minimumChallenge = initialWeight * 0.15;
            if (excessWeight < minimumChallenge) excessWeight = minimumChallenge;
            
            const weightLost = initialWeight - currentWeight;
            const scorePercentage = (weightLost / excessWeight) * 100;
            const imcDrop = initialIMC - currentIMC;
            
            let badges = [];
            if (scorePercentage >= 50) badges.push({ icon: '🌟', title: 'Estrela' });
            else if (scorePercentage >= 20) badges.push({ icon: '⭐', title: 'Focado' });
            
            if (participant.weightHistory.length >= 3) {
                const w1 = participant.weightHistory[participant.weightHistory.length-1].weight;
                const w2 = participant.weightHistory[participant.weightHistory.length-2].weight;
                const w3 = participant.weightHistory[participant.weightHistory.length-3].weight;
                if (w1 < w2 && w2 < w3) badges.push({ icon: '🐢', title: 'Consistente' });
            }
            
            if (participant.targetWeight > 0 && currentWeight <= participant.targetWeight) {
                badges.push({ icon: '🎯', title: 'Meta Batida' });
            }

            return { initialIMC, currentIMC, scorePercentage, imcDrop, weightLost, badges };
        }

        window.toggleModal = function(show) {
            document.getElementById('modal').style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('form').reset();
                editingId = null;
                document.getElementById('initialWeight').disabled = false;
            }
        };

        window.openAddWeightModal = function(id) {
            const p = participants.find(x => x.id === id);
            document.getElementById('addWeightId').value = id;
            document.getElementById('newWeightLabel').innerText = `Novo peso para ${p.name}`;
            document.getElementById('newWeightInput').value = '';
            document.getElementById('addWeightModal').style.display = 'flex';
        };

        window.closeAddWeightModal = function() {
            document.getElementById('addWeightModal').style.display = 'none';
        };

        window.confirmDelete = function(id) {
            if(confirm("Tem certeza que deseja excluir este participante?")) {
                deleteParticipantFromCloud(id);
            }
        };

        document.getElementById('addWeightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('addWeightId').value;
            const newWeight = parseFloat(document.getElementById('newWeightInput').value);
            const date = new Date().toLocaleDateString('pt-BR');
            const p = participants.find(x => x.id === id);
            p.weightHistory.push({ date, weight: newWeight });
            saveParticipantToCloud(p);
            closeAddWeightModal();
        });

        document.getElementById('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const p = {
                name: document.getElementById('name').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                height: parseFloat(document.getElementById('height').value),
                targetWeight: parseFloat(document.getElementById('targetWeight').value) || 0
            };

            if (editingId) {
                const existing = participants.find(x => x.id === editingId);
                existing.name = p.name;
                existing.age = p.age;
                existing.gender = p.gender;
                existing.height = p.height;
                existing.targetWeight = p.targetWeight;
                saveParticipantToCloud(existing);
            } else {
                p.id = Date.now().toString();
                p.weightHistory = [{
                    date: new Date().toLocaleDateString('pt-BR'),
                    weight: parseFloat(document.getElementById('initialWeight').value)
                }];
                saveParticipantToCloud(p);
            }
            toggleModal(false);
        });

        window.editParticipant = function(id) {
            const p = participants.find(x => x.id === id);
            document.getElementById('name').value = p.name;
            document.getElementById('age').value = p.age;
            document.getElementById('gender').value = p.gender;
            document.getElementById('height').value = p.height;
            document.getElementById('initialWeight').value = p.weightHistory[0].weight;
            document.getElementById('targetWeight').value = p.targetWeight || '';
            document.getElementById('initialWeight').disabled = true;
            editingId = p.id;
            toggleModal(true);
        };

        function renderDashboard() {
            const container = document.getElementById('participantsList');
            container.innerHTML = '';
            
            if (participants.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white/5 backdrop-blur-sm rounded-3xl border border-white/10">
                        <p class="text-white/60 text-lg mb-4">Seu desafio está vazio.</p>
                        <button onclick="toggleModal(true)" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full transition-all shadow-lg font-medium">
                            Adicionar Primeiro Competidor
                        </button>
                    </div>`;
                return;
            }

            const evaluated = participants.map(p => ({ ...p, metrics: calculateMetrics(p) }));
            evaluated.sort((a, b) => b.metrics.scorePercentage - a.metrics.scorePercentage);

            if (evaluated.length > 0 && evaluated[0].weightHistory.length > 1) {
                evaluated[0].metrics.badges.unshift({ icon: '🔥', title: 'On Fire' });
            }

            evaluated.forEach((p, index) => {
                const initialWeight = p.weightHistory[0].weight;
                const currentWeight = p.weightHistory[p.weightHistory.length - 1].weight;
                
                let targetProgress = '';
                if (p.targetWeight > 0 && initialWeight > p.targetWeight) {
                    const totalToLose = initialWeight - p.targetWeight;
                    const currentLost = initialWeight - currentWeight;
                    let targetPct = Math.min(100, Math.max(0, (currentLost / totalToLose) * 100));
                    targetProgress = `
                        <div class="mt-2">
                            <div class="flex justify-between text-xs text-white/70 mb-1">
                                <span>Meta Pessoal (${p.targetWeight}kg)</span>
                                <span>${targetPct.toFixed(1)}%</span>
                            </div>
                            <div class="w-full bg-black/20 rounded-full h-1.5">
                                <div class="bg-pink-400 h-1.5 rounded-full" style="width: ${targetPct}%"></div>
                            </div>
                        </div>
                    `;
                }

                const badgesHtml = p.metrics.badges.map(b => `<span title="${b.title}" class="text-xl">${b.icon}</span>`).join(' ');

                const card = document.createElement('div');
                card.className = "bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-6 shadow-xl relative overflow-hidden";
                card.innerHTML = `
                    ${index === 0 ? '<div class="absolute -right-6 -top-6 bg-yellow-400/20 w-24 h-24 rounded-full blur-2xl"></div>' : ''}
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-xl font-bold text-white">#${index + 1} ${p.name}</h3>${badgesHtml}
                            </div>
                            <p class="text-white/60 text-sm">${p.age} anos • ${p.height}cm • ${p.gender === 'M' ? 'Masc' : 'Fem'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openAddWeightModal('${p.id}')" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white" title="Atualizar Peso">⚖️</button>
                            <button onclick="editParticipant('${p.id}')" class="p-2 bg-white/10 hover:bg-white/20 rounded-full text-white" title="Editar">✏️</button>
                            <button onclick="confirmDelete('${p.id}')" class="p-2 bg-red-500/20 hover:bg-red-500/40 rounded-full text-red-200" title="Excluir">🗑️</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4 relative z-10">
                        <div class="bg-black/20 rounded-2xl p-4 text-center">
                            <p class="text-white/60 text-xs mb-1">PESO INICIAL</p>
                            <p class="text-2xl font-bold text-white">${initialWeight.toFixed(1)} <span class="text-sm font-normal
